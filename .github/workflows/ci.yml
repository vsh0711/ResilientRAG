name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        working-directory: backend
        env:
          GROQ_API_KEY: ci-placeholder-key
        run: python -m pytest tests/ --cov=app --cov-report=term-missing

      - name: Smoke-test eval harness (dry run, no network/API key needed)
        working-directory: eval
        env:
          GROQ_API_KEY: ci-placeholder-key
        run: |
          python run_retrieval_eval.py --dry-run
          python run_generation_eval.py --dry-run

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
